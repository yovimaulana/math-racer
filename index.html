<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Racer!</title>
<style>
:root{--bg:#bfe9ff;--card:#fff;--ink:#2b2d42;--accent:#ff6b6b;--ok:#2ec47a;--warn:#ff9f1c;--blue:#4d96ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2b4f;--card:#2b3a67;--ink:#f4f6ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden;user-select:none}
#app{position:relative;width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;padding:8px;gap:6px}
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:6px 12px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
#hearts{font-size:22px;display:flex;gap:2px;min-height:28px}
#hearts span.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
#score{font-weight:800;font-size:18px;white-space:nowrap}
#prog{height:10px;background:rgba(0,0,0,.12);border-radius:8px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd93d,#ff6b6b);transition:width .4s}
#idle{height:6px;background:rgba(0,0,0,.1);border-radius:6px;overflow:hidden}
#idle i{display:block;height:100%;width:0;background:var(--blue)}
#stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
#game{height:100%;max-width:100%;aspect-ratio:2/3;border-radius:22px;border:5px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.18)}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px 0 4px}
#pad button{font-size:26px;padding:10px 0;border:0;border-radius:16px;background:var(--card);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.2);touch-action:none}
#pad button.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2);background:#ffe66d;color:#2b2d42}
#fx{position:absolute;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(20,30,70,.55);backdrop-filter:blur(3px);padding:14px}
.ov.show{display:flex}
.card{width:100%;background:var(--card);border-radius:26px;padding:20px 18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2);animation:in .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes in{from{transform:scale(.6) translateY(40px);opacity:0}}
.card h1{margin:0 0 6px;font-size:30px;color:var(--accent)}
.card p{margin:6px 0}
.tag{display:inline-block;background:var(--warn);color:#fff;border-radius:20px;padding:4px 14px;font-weight:800;font-size:15px}
.q{font-size:40px;font-weight:900;margin:14px 0;letter-spacing:1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button,.btn{font:inherit;font-size:26px;font-weight:800;border:0;border-radius:18px;padding:14px;color:#fff;background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer}
.opts button:nth-child(2){background:#ff6b6b}.opts button:nth-child(3){background:#2ec47a}.opts button:nth-child(4){background:#a06cd5}
.opts button:active,.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn{background:var(--ok);font-size:22px;padding:12px 28px;margin-top:10px}
input.ans{font:inherit;font-size:34px;font-weight:800;width:150px;text-align:center;border:4px solid var(--blue);border-radius:16px;padding:8px;background:#fff;color:#2b2d42;outline:0}
.fb{animation:bounce .7s}
.fb .big{font-size:36px;font-weight:900;margin:6px 0}
.fb.good .big{color:var(--ok);animation:wiggle .8s}
.fb.bad .big{color:var(--warn)}
@keyframes bounce{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.1)}75%{transform:rotate(6deg) scale(1.1)}}
.emoji{font-size:64px;display:block;animation:bounce .8s}
small{opacity:.75}
.lvs{display:flex;gap:8px;justify-content:center;margin:4px 0 8px}
.lv{font:inherit;font-weight:800;font-size:16px;border:3px solid transparent;border-radius:16px;padding:10px 8px;flex:1;background:rgba(0,0,0,.08);color:var(--ink);cursor:pointer}
.lv.on{background:#ffe66d;color:#2b2d42;border-color:var(--warn);transform:scale(1.06)}
#sc{display:flex;gap:10px;align-items:center;font-weight:800;font-size:16px}#pz,#mute{border:0;background:none;font-size:20px;cursor:pointer;padding:0}
.card{max-height:100%;overflow:auto}.lvs{flex-wrap:wrap}.lv{flex:1 0 28%}
.q.sm{font-size:22px;line-height:1.3}
.rod{display:inline-block;width:8px;height:26px;background:#4d96ff;border-radius:3px;margin:0 1px;vertical-align:middle}
.dot{display:inline-block;width:10px;height:10px;background:#ff9f1c;border-radius:50%;margin:0 1px}
.nv{display:block;margin:4px 0;font-weight:700;font-size:15px;text-align:left}
#hv{background:rgba(77,150,255,.12);border-radius:14px;padding:4px 10px;margin-bottom:8px}#hv:empty{display:none}
.fox{display:flex;align-items:center;gap:8px;background:rgba(77,150,255,.15);border-radius:16px;padding:6px 10px;text-align:left;font-size:15px;margin-top:8px}.fox span{font-size:34px}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tl{font:inherit;font-size:14px;font-weight:800;border:0;border-radius:14px;padding:8px 10px;background:#ffe66d;color:#2b2d42;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}.tl:disabled{opacity:.4}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><div id="hearts"></div><div id="sc"><span id="coins">🪙 0</span><span id="score">🏁 0/15</span><button id="pz" title="Pause">⏸️</button><button id="mute">🔊</button></div></div>
  <div id="prog"><i></i></div>
  <div id="idle"><i></i></div>
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="pad">
    <button data-k="left">⬅️</button><button data-k="up">⬆️</button><button data-k="down">⬇️</button><button data-k="right">➡️</button>
  </div>
  <div class="ov show" id="start"><div class="card">
    <span class="emoji" style="font-size:46px">🏎️</span>
    <h1>Math Racer!</h1>
    <p>Overtake <b>15 cars</b> and answer <b>10 questions</b> correctly to win! 🏆 Grab ❓ boxes for bonus questions, 🪙 coins and 🛡️ shields.</p>
    <p><small>Crash = a math question. Use arrow keys / WASD or the on-screen buttons. You start with 5 ❤️</small></p>
    <p><b>Traffic speed</b></p>
    <div class="lvs" id="g1"><button class="lv on" data-l="0">🐢 Slow</button><button class="lv" data-l="1">🚗 Normal</button><button class="lv" data-l="2">🚀 Fast</button></div>
    <p><b>Question timer</b> <small>(when no crash)</small></p>
    <div class="lvs" id="g2"><button class="lv" data-t="6.5">⏱️ 6.5s</button><button class="lv on" data-t="12">🕐 12s</button><button class="lv" data-t="0">♾️ Off</button></div>
    <p><b>Garage</b> <span id="wal"></span></p>
    <div class="lvs" id="garage"></div>
    <button class="btn" id="go">Start Racing!</button>
  </div></div>
  <div class="ov" id="modal"><div class="card" id="mcard"></div></div>
  <canvas id="fx"></canvas>
</div>
<script>
(function(){
const $=s=>document.querySelector(s);
const cv=$('#game'),ctx=cv.getContext('2d'),fx=$('#fx'),fctx=fx.getContext('2d');
const W=400,H=600,RL=50,RR=350,TARGET=15,MAXL=8;let IDLE=12;
function fit(){const d=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;const a=$('#app').getBoundingClientRect();fx.width=a.width*d;fx.height=a.height*d;}
addEventListener('resize',fit);

/* ===== Setup ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
let st='menu',lives=5,score=0,idle=0,npcs=[],items=[],pops=[],px=200,py=470,vx=0,vy=0,S=260,roadOff=0,spawnT=0,itemT=1,invul=0,shake=0,curQ=null,locked=false,last=0;
let boost=0,qLv=0,streak=0,wrongRow=0,hints=3,fifty=2,tries=0,hintOn=false,shield=false,lvl=0,curTh=0,muted=false,AC,correct=0,gameT=0,box=false;
const MINQ=10,MAXT=300;
const keys={left:0,right:0,up:0,down:0};
const colors=['#ff6b6b','#4d96ff','#2ec47a','#a06cd5','#ff9f1c','#ff7eb6','#17c3b2'];
const CARS=[{n:'Sunny',c:'#ffd93d',p:0},{n:'Berry',c:'#ff6b9d',p:15},{n:'Mint',c:'#2ec47a',p:30},{n:'Galaxy',c:'#a06cd5',p:50},{n:'Rocket',c:'#4d96ff',p:80}];
const LEVELS=[{min:90,max:140,gap:[1.1,1.7]},{min:120,max:190,gap:[.8,1.6]},{min:170,max:235,gap:[.6,1.2]}];
const TH=[{g:'#7bd88f',r:'#4a4e69',t:'#2f9e44'},{g:'#f2d49b',r:'#6b5b4b',t:'#c98c3a'},{g:'#252a5c',r:'#343a6e',t:'#7a5cff'}];
let save={coins:0,own:[0],car:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('mr1')||'{}'));}catch(e){}
function persist(){try{localStorage.setItem('mr1',JSON.stringify(save));}catch(e){}}

/* ===== Sound ===== */
function ac(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(delay||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);}
const sfx={good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.09)),oops:()=>{tone(330,.2,'sine',.12);tone(262,.3,'sine',.12,.15);},crash:()=>{tone(90,.35,'sawtooth',.2);tone(60,.4,'square',.12,.05);},coin:()=>{tone(988,.08,'square',.06);tone(1319,.15,'square',.06,.07);},pass:()=>tone(700,.08,'triangle',.08)};
let mi=0;setInterval(()=>{if(st==='play')tone([262,330,392,330,294,392,440,392][mi++%8],.22,'triangle',.04);},280);

/* ===== Question bank: 4 difficulty levels x 12 = 48 unique, refilled as needed ===== */
const NI=[.15,.3,.45,.5];
const TIP={a:'Add the tens first, then the ones!',s:'Take away the tens first, then the ones!',m:'Count up (or back) from one number to the other!',t:'Do it in two small steps!'};
const GEN=[
 ()=>{if(Math.random()<.5){const a0=R(0,8),b0=R(1,9-a0),a=R(1,5)*10+a0,b=R(0,4)*10+b0;return['a',a+' + '+b+' = ?',a+b,[a,b]];}const x=R(2,9),u=R(0,9),y=R(1,x),v=R(0,u),a=x*10+u,b=y*10+v;return['s',a+' − '+b+' = ?',a-b,[a,b]];},
 ()=>{if(Math.random()<.5){const a=R(11,89),b=R(11,100-a);return['a',a+' + '+b+' = ?',a+b,[a,b]];}const x=R(4,9),u=R(2,9),y=R(1,x-1),v=R(0,u),a=x*10+u,b=y*10+v;return['s',a+' − '+b+' = ?',a-b,[a,b]];},
 ()=>{if(Math.random()<.5){const a=R(30,100),b=R(11,a-5);return['s',a+' − '+b+' = ?',a-b,[a,b]];}const a=R(10,70),c=R(a+10,100);return['m',a+' + ? = '+c,c-a,[a,c]];},
 ()=>{if(Math.random()<.4){const a=R(40,100),c=R(5,a-10);return['m',a+' − ? = '+c,a-c,[a,c]];}const a=R(10,60),b=R(5,30),c=R(5,a+b-1);return['t',a+' + '+b+' − '+c+' = ?',a+b-c,[a,b]];}
];
const story=()=>{if(Math.random()<.5){const a=R(15,60),b=R(10,40);return['a','🍎 Mia has '+a+' apples. She gets '+b+' more. How many apples now?',a+b,[a,b]];}const a=R(30,90),b=R(10,a-5);return['s','🎈 There are '+a+' balloons. '+b+' fly away. How many are left?',a-b,[a,b]];};
const bank=[[],[],[],[]],seen=new Set();
function fill(l){let g=0;while(bank[l].length<12&&g++<400){const r=(l>0&&l<3&&Math.random()<.2?story:GEN[l])(),text=r[1],ans=r[2];if(ans<1||ans>100||seen.has(text))continue;seen.add(text);bank[l].push({kind:r[0],text,ans,nums:r[3],tip:TIP[r[0]],type:Math.random()<NI[l]?'input':'choice',lv:l+1});}}
function nextQ(){if(!bank[qLv].length)fill(qLv);if(!bank[qLv].length){seen.clear();fill(qLv);}return bank[qLv].pop();}

/* ===== HUD / start ===== */
function hud(inc){
  const h=$('#hearts');h.innerHTML='';
  for(let i=0;i<lives;i++){const s=document.createElement('span');s.textContent='❤️';if(inc&&i===lives-1)s.className='pop';h.appendChild(s);}
  if(!lives)h.textContent='💔';
  $('#coins').textContent='🪙 '+save.coins;
  $('#score').textContent=(shield?'🛡️ ':'')+'🏁 '+score+'/'+TARGET+' 🧠 '+Math.min(correct,MINQ)+'/'+MINQ;
  $('#prog i').style.width=((score/TARGET+Math.min(correct,MINQ)/MINQ)/2*100)+'%';
}
function start(){
  ac();lives=5;score=0;idle=0;npcs=[];items=[];pops=[];px=200;py=470;vx=vy=0;boost=0;spawnT=0;itemT=1;invul=1;
  qLv=0;streak=0;wrongRow=0;hints=3;fifty=2;shield=false;curTh=0;correct=0;gameT=0;st='play';
  $('#start').classList.remove('show');$('#modal').classList.remove('show');hud();
}
$('#go').onclick=start;
document.querySelectorAll('#g1 .lv,#g2 .lv').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('.lv').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.l)lvl=+b.dataset.l;else IDLE=+b.dataset.t;});
function renderGarage(){
  $('#wal').textContent='🪙 '+save.coins;const g=$('#garage');g.innerHTML='';
  CARS.forEach((c,i)=>{const own=save.own.includes(i),b=document.createElement('button');b.className='lv'+(save.car===i?' on':'');
    b.innerHTML='<span style="color:'+c.c+'">●</span> '+c.n+(own?'':' 🪙'+c.p);
    b.onclick=()=>{if(own){save.car=i;}else if(save.coins>=c.p){save.coins-=c.p;save.own.push(i);save.car=i;sfx.good();}else{b.textContent='Need '+(c.p-save.coins)+' more 🪙';sfx.oops();return;}persist();hud();renderGarage();};
    g.appendChild(b);});
}
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';};
function pause(){
  if(st!=='play')return;st='paused';
  Object.keys(keys).forEach(k=>keys[k]=0);document.querySelectorAll('#pad button').forEach(b=>b.classList.remove('on'));
  $('#mcard').innerHTML='<span class="emoji">⏸️</span><h1>Paused</h1><p>Take a break! Your game is waiting. 😊</p><button class="btn" id="rs">Resume ▶️</button><br><button class="btn" id="rst" style="background:var(--warn)">Restart 🔁</button><br><button class="btn" id="mn" style="background:var(--blue)">Settings & Garage ⚙️</button>';
  $('#modal').classList.add('show');
  $('#rs').onclick=unpause;$('#rst').onclick=start;
  $('#mn').onclick=()=>{$('#modal').classList.remove('show');$('#start').classList.add('show');st='menu';renderGarage();};
}
function unpause(){if(st!=='paused')return;$('#modal').classList.remove('show');st='play';invul=1;}
$('#pz').onclick=pause;
addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(st==='paused')unpause();else pause();}});

/* ===== Input ===== */
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};
addEventListener('keydown',e=>{const k=map[e.key];if(k&&st==='play'){keys[k]=1;e.preventDefault();}});
addEventListener('keyup',e=>{const k=map[e.key];if(k)keys[k]=0;});
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k,on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on');},off=e=>{e.preventDefault();keys[k]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off));
});

/* ===== Question UI ===== */
const GOOD=['Great Job! 🎉','Awesome! 🌟','Super Smart! 🚀','Well Done! 👏'],BAD=['Keep Going! 💪','Nice Try! 🌈','You Can Do It! ⭐'];
const FOXT=['You can do it! Take your time.','Count the tens first, then the ones!','Need help? Tap 💡 Hint!','Every try makes you smarter!'];
const vis=n=>'<span class="nv">'+n+': '+'<i class="rod"></i>'.repeat(Math.floor(n/10))+'<i class="dot"></i>'.repeat(n%10)+'</span>';
const fox=t=>'<div class="fox"><span>🦊</span><b>'+t+'</b></div>';
function tools(){const h=$('#hb');h.textContent='💡 Hint ('+hints+')';h.disabled=!hintOn&&hints<=0;const f=$('#fb');if(f){f.textContent='✂️ 50:50 ('+fifty+')';f.disabled=fifty<=0;}}
function showHint(free){if(!hintOn){if(!free){if(hints<=0)return;hints--;}hintOn=true;}$('#hv').innerHTML=curQ.nums.map(vis).join('')+'<small>'+curQ.tip+'</small>';tools();}
function openQ(reason){
  st='question';idle=0;locked=false;tries=0;hintOn=false;box=reason==='box';
  Object.keys(keys).forEach(k=>keys[k]=0);document.querySelectorAll('#pad button').forEach(b=>b.classList.remove('on'));
  const q=curQ=nextQ(),ch=q.type==='choice';
  let b=(reason==='box'?'<span class="emoji" style="font-size:44px">🎁</span><h1>Bonus question!</h1>':reason==='crash'?'<span class="emoji" style="font-size:44px">💥</span><h1>Oops, a bump!</h1>':'<span class="emoji" style="font-size:44px">🤔</span><h1>Time to think!</h1>')+'<span class="tag">⭐ Level '+q.lv+'</span><div class="q'+(q.text.length>22?' sm':'')+'">'+q.text+'</div><div id="hv"></div>';
  if(ch){const set=new Set([q.ans]);let g=0;while(set.size<4&&g++<99){const d=q.ans+pick([-10,-2,-1,1,2,10,R(-9,9)]);if(d>=0&&d<=100)set.add(d);}
    b+='<div class="opts">'+[...set].sort(()=>Math.random()-.5).map(n=>'<button data-v="'+n+'">'+n+'</button>').join('')+'</div>';}
  else b+='<input class="ans" id="ai" type="number" inputmode="numeric" placeholder="?"><br><button class="btn" id="ab">Check ✔️</button>';
  b+='<div class="tools"><button class="tl" id="hb"></button>'+(ch?'<button class="tl" id="fb"></button>':'')+'<button class="tl" id="sk">⏭️ Skip (−2 🪙)</button></div><div id="msg">'+fox(pick(FOXT))+'</div>';
  $('#mcard').innerHTML=b;$('#modal').classList.add('show');tools();
  document.querySelectorAll('.opts button').forEach(x=>x.onclick=()=>answer(+x.dataset.v,x));
  const ai=$('#ai');if(ai){$('#ab').onclick=()=>{if(ai.value!=='')answer(+ai.value);};ai.addEventListener('keydown',e=>{if(e.key==='Enter'&&ai.value!=='')answer(+ai.value);});setTimeout(()=>ai.focus(),350);}
  $('#hb').onclick=()=>{if(!locked)showHint(false);};
  const f=$('#fb');if(f)f.onclick=()=>{if(fifty<=0||locked)return;fifty--;let n=0;document.querySelectorAll('.opts button').forEach(x=>{if(+x.dataset.v!==curQ.ans&&n<2&&!x.disabled){x.style.visibility='hidden';n++;}});tools();};
  $('#sk').onclick=()=>{if(locked)return;locked=true;save.coins=Math.max(0,save.coins-2);persist();hud();$('#mcard').innerHTML='<div class="fb"><span class="emoji">👍</span><div class="big">No problem!</div><p>Let’s keep racing!</p></div>';setTimeout(resume,1100);};
}
function answer(v,btn){
  if(locked)return;
  if(v===curQ.ans)return done(true);
  if(tries++===0){
    sfx.oops();if(btn){btn.disabled=true;btn.style.opacity=.3;}else{const a=$('#ai');a.value='';a.focus();}
    showHint(true);$('#msg').innerHTML=fox('Almost! Look at the blocks and try once more 💪');return;}
  done(false);
}
function done(ok){
  locked=true;let extra='';
  if(ok){correct++;streak++;wrongRow=0;if(!box)lives=Math.min(MAXL,lives+1);sfx.good();confetti(160);let c=box?5:1;
    if(streak>=3){c+=3;extra+='<p>🔥 Streak x'+streak+'! Bonus +3 🪙</p>';}
    if(streak%3===0&&qLv<3){qLv++;extra+='<p>🚀 Questions get a little harder!</p>';}
    save.coins+=c;persist();}
  else{streak=0;if(!box)lives--;wrongRow++;sfx.oops();if(wrongRow>=2&&qLv>0){qLv--;wrongRow=0;}}
  hud(ok&&!box);
  $('#mcard').innerHTML=ok
    ?'<div class="fb good"><span class="emoji">🥳</span><div class="big">'+pick(GOOD)+'</div><p>'+(box?'Bonus! +5 🪙':'Life +1 ❤️ and +1 🪙')+'</p>'+extra+fox('I knew you could do it!')+'</div>'
    :'<div class="fb bad"><span class="emoji">🤗</span><div class="big">'+pick(BAD)+'</div><p>The answer is <b>'+curQ.ans+'</b>. '+(box?'No life lost!':'Life −1 💔')+'</p>'+curQ.nums.map(vis).join('')+'<small>'+curQ.tip+'</small>'+fox('Mistakes help us learn. You’ll get the next one!')+'</div>';
  setTimeout(resume,ok?1900:3400);
}
function resume(){$('#modal').classList.remove('show');if(lives<=0)return end(false);if(score>=TARGET&&correct>=MINQ)return end(true);st='play';idle=0;invul=1.5;}
function end(win,timeUp){
  st='over';let extra='';
  if(win){save.coins+=10;persist();hud();const n=lives>=5?3:lives>=3?2:1;extra='<p style="font-size:34px;margin:4px">'+'⭐'.repeat(n)+'</p><p>Bonus +10 🪙</p>';sfx.good();confetti(300);}
  $('#mcard').innerHTML=(win
    ?'<span class="emoji">🏆</span><h1>You’re the Champion!</h1><p>You reached '+TARGET+' points with '+lives+' ❤️ left!</p>'
    :(timeUp?'<span class="emoji">⏰</span><h1>Time’s up!</h1><p>Great racing! You answered '+correct+' questions correctly. Let’s play again!</p>':'<span class="emoji">🌟</span><h1>Out of lives!</h1><p>That’s okay, you tried your best. Let’s try again!</p>'))+extra
    +'<button class="btn" id="again">Play Again 🔁</button><br><button class="btn" id="menu" style="background:var(--blue)">Settings & Garage ⚙️</button>';
  $('#modal').classList.add('show');$('#again').onclick=start;
  $('#menu').onclick=()=>{$('#modal').classList.remove('show');$('#start').classList.add('show');st='menu';renderGarage();};
}

/* ===== Confetti ===== */
let parts=[];
function confetti(n){
  const w=fx.width,h=fx.height;
  for(let i=0;i<n;i++)parts.push({x:w/2+(Math.random()-.5)*w*.3,y:h*.45,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*16-4)*devicePixelRatio,s:(5+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:'hsl('+R(0,360)+',90%,60%)',l:1});
}
function drawFx(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.l>0&&p.y<fx.height+30);
  parts.forEach(p=>{p.vy+=.45*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.l-=.004;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.globalAlpha=Math.max(p.l,0);fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fctx.restore();});
}

/* ===== Update ===== */
function update(dt){
  const dx=keys.right-keys.left,dy=keys.down-keys.up,k=Math.min(1,dt*7);
  vx+=(dx*260-vx)*k;vy+=(dy*230-vy)*k;
  px=Math.max(RL+26,Math.min(RR-26,px+vx*dt));py=Math.max(160,Math.min(H-60,py+vy*dt));
  boost+=((keys.up?1:keys.down?-1:0)-boost)*Math.min(1,dt*3);S=260+boost*(boost>0?150:20);roadOff+=S*dt;
  invul=Math.max(0,invul-dt);shake=Math.max(0,shake-dt);
  spawnT-=dt;
  if(spawnT<=0){const L=LEVELS[lvl];spawnT=L.gap[0]+Math.random()*(L.gap[1]-L.gap[0]);const x=RL+32+Math.random()*(RR-RL-64);
    if(!npcs.some(n=>n.y<130&&Math.abs(n.x-x)<62))npcs.push({x,y:-90,v:L.min+Math.random()*(L.max-L.min),c:pick(colors),passed:false});}
  itemT-=dt;
  if(itemT<=0){itemT=1.6+Math.random()*1.4;const r=Math.random(),pq=correct<MINQ?(score>=TARGET?.6:.3):.1;items.push({x:RL+30+Math.random()*(RR-RL-60),y:-40,t:r<.1?'shield':r<.1+pq?'q':'coin'});}
  for(const n of npcs){
    n.y+=(S-n.v)*dt;
    if(invul<=0&&!n.dead&&Math.abs(n.x-px)<40&&Math.abs(n.y-py)<68){
      n.dead=true;
      if(shield){shield=false;shake=.2;pops.push({x:px,y:py-50,t:1,s:'🛡️ Saved!'});sfx.crash();hud();continue;}
      shake=.4;sfx.crash();idle=0;openQ('crash');return;}
    if(!n.passed&&n.y>py+75){n.passed=true;sfx.pass();if(score<TARGET){score++;pops.push({x:n.x,y:py,t:1,s:'+1 ⭐'});}else if(correct<MINQ)pops.push({x:n.x,y:py,t:1.2,s:'Grab a ❓!'});hud();
      if(score>=TARGET&&correct>=MINQ){end(true);return;}
      const th=score>=10?2:score>=5?1:0;if(th!==curTh){curTh=th;pops.push({x:200,y:300,t:1.6,s:'New track! 🌟'});}}
  }
  for(const i of items){if(i.dead)continue;i.y+=S*dt;
    if(Math.abs(i.x-px)<34&&Math.abs(i.y-py)<46){i.dead=true;
      if(i.t==='coin'){save.coins++;persist();sfx.coin();pops.push({x:i.x,y:i.y,t:.8,s:'+1 🪙'});}
      else if(i.t==='q'){i.dead=true;items=items.filter(x=>!x.dead);sfx.good();hud();openQ('box');return;}
      else{shield=true;sfx.good();pops.push({x:i.x,y:i.y,t:1,s:'🛡️ Shield!'});}hud();}}
  items=items.filter(i=>!i.dead&&i.y<H+40);
  npcs=npcs.filter(n=>!n.dead&&n.y<H+120);
  pops.forEach(p=>{p.t-=dt;p.y-=60*dt;});pops=pops.filter(p=>p.t>0);
  idle+=dt;$('#idle i').style.width=IDLE?Math.min(100,idle/IDLE*100)+'%':'0';
  if(IDLE&&idle>=IDLE)openQ('idle');
}

/* ===== Draw ===== */
function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function car(x,y,c,me){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(3,6,28,42,0,0,7);ctx.fill();
  rr(-27,-26,10,18,4,'#222');rr(17,-26,10,18,4,'#222');rr(-27,16,10,18,4,'#222');rr(17,16,10,18,4,'#222');
  rr(-22,-38,44,76,16,c);
  rr(-16,-22,32,18,7,'#cfeeff');rr(-16,10,32,12,5,'#a8dcf5');
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-3,-36,6,72);
  ctx.fillStyle='#fff7b0';ctx.beginPath();ctx.arc(-13,-34,4,0,7);ctx.arc(13,-34,4,0,7);ctx.fill();
  ctx.fillStyle='#2b2d42';ctx.beginPath();ctx.arc(-6,-12,2.5,0,7);ctx.arc(6,-12,2.5,0,7);ctx.fill();
  ctx.strokeStyle='#2b2d42';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-9,5,.2,Math.PI-.2);ctx.stroke();
  if(me){ctx.fillStyle='#ffd93d';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('⭐',0,34);}
  ctx.restore();
}
function tree(x,y,c){ctx.fillStyle='#8d5524';ctx.fillRect(x-3,y,6,14);ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y-4,16,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(x-4,y-8,8,0,7);ctx.fill();}
function draw(){
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*25*shake,(Math.random()-.5)*25*shake);
  const T=TH[curTh],o=roadOff%120;
  ctx.fillStyle=T.g;ctx.fillRect(-20,-20,W+40,H+40);
  for(let i=-1;i<7;i++){const y=i*100+(roadOff%100);tree(22,y,T.t);tree(378,y+45,T.t);}
  ctx.fillStyle=T.r;ctx.fillRect(RL,0,RR-RL,H);
  ctx.fillStyle='#fff';ctx.fillRect(RL-4,0,4,H);ctx.fillRect(RR,0,4,H);
  for(let l=1;l<3;l++)for(let i=-1;i<7;i++)ctx.fillRect(RL+(RR-RL)/3*l-3,i*120+o,6,60);
  ctx.textAlign='center';ctx.font='28px sans-serif';
  items.forEach(i=>ctx.fillText(i.t==='coin'?'🪙':i.t==='q'?'❓':'🛡️',i.x,i.y+10));
  npcs.slice().sort((a,b)=>a.y-b.y).forEach(n=>car(n.x,n.y,n.c,false));
  if(!(invul>0&&Math.floor(invul*10)%2)){car(px,py,CARS[save.car].c,true);
    if(shield){ctx.strokeStyle='#4dd2ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(px,py,50,0,7);ctx.stroke();}}
  pops.forEach(p=>{ctx.globalAlpha=Math.min(1,Math.max(0,p.t));ctx.font='900 28px Trebuchet MS,sans-serif';ctx.fillStyle='#fff';ctx.strokeStyle='#ff6b6b';ctx.lineWidth=5;ctx.strokeText(p.s,p.x,p.y);ctx.fillText(p.s,p.x,p.y);ctx.globalAlpha=1;});
  ctx.restore();
}

function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(st==='play'||st==='question')gameT+=dt;
  if(st==='play'&&gameT>=MAXT)end(false,true);else if(st==='play')update(dt);
  draw();drawFx();requestAnimationFrame(loop);
}
fit();hud();renderGarage();requestAnimationFrame(loop);
})();
</script>
